<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>托福听力五记号词汇 · 学习与默写</title>
<style>
  :root{
    --paper:#F3F0E7;
    --paper2:#EAE4D5;
    --ink:#1D2530;
    --muted:#726C5C;
    --line:#D9D2C0;
    --white:#FFFFFF;
    --up:#2C5AA0;
    --down:#B23A2E;
    --star:#B8862E;
    --emo:#7A5C8E;
    --slate:#5B6B73;
    --ok:#2F7D4F;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --serif: Georgia, "Songti SC", "STSong", "Noto Serif SC", serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--serif);}
  body{padding:28px 18px 80px;}
  .wrap{max-width:960px;margin:0 auto;}

  /* header */
  header{text-align:center;margin-bottom:22px;}
  h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px;letter-spacing:0.5px;}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:18px;}

  .stamp-row{display:flex;justify-content:center;gap:16px;margin:18px 0 28px;flex-wrap:wrap;}
  .stamp{
    width:56px;height:56px;border-radius:50%;
    border:2px dashed currentColor;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-family:var(--mono);
    opacity:0.85;
  }
  .stamp.up{color:var(--up);transform:rotate(-6deg);}
  .stamp.down{color:var(--down);transform:rotate(4deg);}
  .stamp.star{color:var(--star);transform:rotate(-3deg);}
  .stamp.cross{color:var(--down);transform:rotate(5deg);}

  /* mode tabs */
  .tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;}
  .tab-btn{
    padding:9px 22px;border-radius:999px;border:1px solid var(--ink);
    background:var(--white);color:var(--ink);font-family:var(--serif);font-size:15px;
    cursor:pointer;transition:all .15s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);}

  /* filter panel */
  .panel{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;margin-bottom:20px;
  }
  .panel h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px;font-family:var(--mono);font-weight:600;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{
    padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--paper);
    font-size:13px;cursor:pointer;user-select:none;color:var(--muted);
    border-left-width:4px;transition:all .12s ease;
  }
  .chip.selected{background:var(--paper2);color:var(--ink);font-weight:600;}
  .panel-actions{display:flex;gap:10px;align-items:center;font-size:13px;}
  .link-btn{background:none;border:none;color:var(--up);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;font-family:var(--serif);}
  .count-badge{color:var(--muted);font-size:13px;margin-left:auto;font-family:var(--mono);}

  /* study cards */
  #studyView{display:none;}
  .search-box{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--mono);margin-bottom:16px;background:var(--white);}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .flashcard{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:14px 14px 12px;cursor:pointer;position:relative;min-height:92px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .flashcard .bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:6px 6px 0 0;}
  .flashcard .en{font-family:var(--mono);font-size:15px;font-weight:600;word-break:break-word;}
  .flashcard .zh{font-family:var(--serif);font-size:14px;color:var(--muted);margin-top:6px;display:none;}
  .flashcard.flipped .en{color:var(--muted);font-size:13px;}
  .flashcard.flipped .zh{display:block;color:var(--ink);font-size:16px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .speak-btn{
    background:none;border:1px solid var(--line);border-radius:5px;width:26px;height:26px;
    font-size:13px;cursor:pointer;flex-shrink:0;color:var(--ink);
  }
  .speak-btn:hover{background:var(--paper2);}
  .cat-tag{font-size:10px;color:var(--white);border-radius:3px;padding:1px 6px;font-family:var(--mono);align-self:flex-start;margin-top:8px;}

  /* dictation */
  #dictationSetup, #dictationQuiz, #dictationSummary{display:none;}
  .quiz-card{
    background:var(--white);border:1px solid var(--line);border-radius:8px;
    padding:36px 30px;text-align:center;max-width:520px;margin:0 auto;
  }
  .progress-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:22px;}
  .quiz-zh{font-size:26px;margin:10px 0 6px;font-weight:600;}
  .quiz-cattag{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:20px;}
  .quiz-input{
    width:100%;padding:12px 14px;font-size:18px;font-family:var(--mono);
    border:2px solid var(--line);border-radius:6px;text-align:center;margin-bottom:16px;
  }
  .quiz-input:focus{outline:none;border-color:var(--up);}
  .quiz-input.correct{border-color:var(--ok);background:#F1F8F3;}
  .quiz-input.wrong{border-color:var(--down);background:#FBF0EE;}
  .feedback-line{min-height:26px;font-family:var(--mono);font-size:14px;margin-bottom:12px;}
  .feedback-line.correct{color:var(--ok);}
  .feedback-line.wrong{color:var(--down);}
  .quiz-actions{display:flex;gap:10px;justify-content:center;}
  .primary-btn{
    background:var(--ink);color:var(--paper);border:none;border-radius:6px;
    padding:11px 26px;font-size:15px;cursor:pointer;font-family:var(--serif);
  }
  .primary-btn:hover{opacity:0.85;}
  .ghost-btn{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
    padding:11px 20px;font-size:14px;cursor:pointer;font-family:var(--serif);
  }
  .quiz-speak{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper);cursor:pointer;font-size:20px;margin-bottom:18px;
  }
  .quiz-speak:hover{background:var(--paper2);}
  .end-link{margin-top:18px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}

  /* summary */
  .score-circle{
    width:120px;height:120px;border-radius:50%;border:4px solid var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    margin:0 auto 20px;font-family:var(--mono);
  }
  .score-circle .pct{font-size:28px;font-weight:700;}
  .score-circle .frac{font-size:12px;color:var(--muted);}
  .wrong-table{width:100%;border-collapse:collapse;margin-top:20px;text-align:left;font-size:14px;}
  .wrong-table th{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px;}
  .wrong-table td{padding:8px 8px;border-bottom:1px solid var(--paper2);}
  .wrong-table td.en{font-family:var(--mono);color:var(--down);}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:50px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>托福听力五记号词汇</h1>
    <div class="subtitle">学习模式 · 默写测试 · 内置发音</div>
    <div class="stamp-row">
      <div class="stamp up">⬆</div>
      <div class="stamp down">⬇</div>
      <div class="stamp star">✨</div>
      <div class="stamp cross">✖</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabStudy">📖 学习模式</button>
    <button class="tab-btn" id="tabDictation">✏️ 默写模式</button>
  </div>

  <div class="panel">
    <h2>选择分类</h2>
    <div class="chip-row" id="chipRow"></div>
    <div class="panel-actions">
      <button class="link-btn" id="selectAll">全选</button>
      <button class="link-btn" id="selectNone">清空</button>
      <span class="count-badge" id="countBadge"></span>
    </div>
  </div>

  <!-- 学习模式 -->
  <div id="studyView">
    <input type="text" class="search-box" id="searchBox" placeholder="搜索单词或中文意思…">
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <!-- 默写设置 -->
  <div id="dictationSetup">
    <div class="panel" style="text-align:center;">
      <h2>默写设置</h2>
      <p style="color:var(--muted);font-size:14px;">系统会显示中文意思，你需要拼写出对应的英文单词/词组。可点击🔊听发音辅助记忆。</p>
      <p style="font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:16px;" id="dictationCount"></p>
      <button class="primary-btn" id="startDictation">开始默写</button>
    </div>
  </div>

  <!-- 默写测试中 -->
  <div id="dictationQuiz">
    <div class="quiz-card">
      <div class="progress-line">
        <span id="quizProgress">第 1 / 20 题</span>
        <span id="quizScore">正确 0 / 已答 0</span>
      </div>
      <div class="quiz-cattag" id="quizCat"></div>
      <div class="quiz-zh" id="quizZh"></div>
      <button class="quiz-speak" id="quizSpeak" title="播放发音">🔊</button>
      <div>
        <input type="text" class="quiz-input" id="quizInput" placeholder="输入英文单词 / 词组" autocomplete="off">
      </div>
      <div class="feedback-line" id="quizFeedback"></div>
      <div class="quiz-actions" id="quizActions">
        <button class="primary-btn" id="quizSubmit">提交（Enter）</button>
      </div>
      <div class="end-link" id="endQuiz">结束本次默写，查看结果</div>
    </div>
  </div>

  <!-- 默写结果 -->
  <div id="dictationSummary">
    <div class="quiz-card" style="max-width:560px;">
      <h2 style="font-family:var(--serif);font-size:20px;margin-top:0;">默写结果</h2>
      <div class="score-circle">
        <div class="pct" id="sumPct">0%</div>
        <div class="frac" id="sumFrac">0 / 0</div>
      </div>
      <div id="sumWrongWrap">
        <p style="color:var(--muted);font-size:13px;text-align:left;margin-bottom:4px;">需要复习的词：</p>
        <table class="wrong-table" id="wrongTable"></table>
      </div>
      <div class="quiz-actions" style="margin-top:24px;">
        <button class="primary-btn" id="reviewWrong">只复习错题</button>
        <button class="ghost-btn" id="restartAll">重新开始</button>
      </div>
    </div>
  </div>

  <footer>
    发音功能基于浏览器自带的语音合成（Web Speech API），建议使用 Chrome / Edge 浏览器获得最佳效果。<br>
    默写判分不区分大小写，会自动去除首尾空格；含 " / " 的词组按其中任一写法均可判定正确。
  </footer>

</div>

// ---------------- 状态 ----------------
let selectedCats = new Set(CATS.map(c=>c.id));
let currentMode = 'study'; // study | dictation

// 默写状态
let quizQueue = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizAnswered = 0;
let quizWrongList = [];
let currentAnswered = false;
let reviewMode = false;

// ---------------- 语音 ----------------
function speak(text){
  if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音合成，请使用 Chrome 或 Edge。');return;}
  window.speechSynthesis.cancel();
  const clean = text.replace(/\(s\)/g,'s').replace(/\/.*/,'').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

// ---------------- 渲染分类chip ----------------
const chipRow = document.getElementById('chipRow');
CATS.forEach(c=>{
  const chip = document.createElement('div');
  chip.className = 'chip selected';
  chip.style.borderLeftColor = c.color;
  chip.textContent = c.label;
  chip.dataset.cat = c.id;
  chip.addEventListener('click',()=>{
    if(selectedCats.has(c.id)){selectedCats.delete(c.id);chip.classList.remove('selected');}
    else{selectedCats.add(c.id);chip.classList.add('selected');}
    refreshAll();
  });
  chipRow.appendChild(chip);
});
document.getElementById('selectAll').addEventListener('click',()=>{
  selectedCats = new Set(CATS.map(c=>c.id));
  document.querySelectorAll('.chip').forEach(el=>el.classList.add('selected'));
  refreshAll();
});
document.getElementById('selectNone').addEventListener('click',()=>{
  selectedCats.clear();
  document.querySelectorAll('.chip').forEach(el=>el.classList.remove('selected'));
  refreshAll();
});

function getFilteredWords(){
  return WORDS.filter(w=>selectedCats.has(w.cat));
}

// ---------------- 学习模式 ----------------
const cardGrid = document.getElementById('cardGrid');
const searchBox = document.getElementById('searchBox');

function renderCards(){
  const q = searchBox.value.trim().toLowerCase();
  let list = getFilteredWords();
  if(q){
    list = list.filter(w=> w.en.toLowerCase().includes(q) || w.zh.includes(q));
  }
  cardGrid.innerHTML = '';
  list.forEach(w=>{
    const cat = CATS.find(c=>c.id===w.cat);
    const card = document.createElement('div');
    card.className = 'flashcard';
    card.innerHTML = `
      <div class="bar" style="background:${cat.color}"></div>
      <div class="card-top">
        <div class="en">${w.en}</div>
        <button class="speak-btn" title="播放发音">🔊</button>
      </div>
      <div class="zh">${w.zh}</div>
      <div class="cat-tag" style="background:${cat.color}">${cat.label}</div>
    `;
    card.querySelector('.speak-btn').addEventListener('click',(e)=>{
      e.stopPropagation();
      speak(w.en);
    });
    card.addEventListener('click',()=> card.classList.toggle('flipped'));
    cardGrid.appendChild(card);
  });
}
searchBox.addEventListener('input', renderCards);

// ---------------- 默写模式 ----------------
function normalize(s){
  return s.trim().toLowerCase().replace(/\s+/g,' ');
}
function getAnswers(w){
  if(w.answers) return w.answers.map(normalize);
  // 支持 "a / b" 形式，任一写法正确；括号内容忽略
  const base = w.en.replace(/\([^)]*\)/g,'').trim();
  return base.split('/').map(s=>normalize(s));
}

function setupDictationCount(){
  const pool = getFilteredWords().filter(w=>w.dictation!==false);
  document.getElementById('dictationCount').textContent = `本次范围内共有 ${pool.length} 个可默写词条`;
}

document.getElementById('startDictation').addEventListener('click', ()=>{
  reviewMode = false;
  startQuiz(getFilteredWords().filter(w=>w.dictation!==false));
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(words){
  if(words.length===0){alert('当前分类下没有可默写的词，请先选择至少一个分类。');return;}
  quizQueue = shuffle(words);
  quizIndex = 0;
  quizCorrect = 0;
  quizAnswered = 0;
  quizWrongList = [];
  showView('dictationQuiz');
  renderQuizQuestion();
}

function renderQuizQuestion(){
  currentAnswered = false;
  const w = quizQueue[quizIndex];
  const cat = CATS.find(c=>c.id===w.cat);
  document.getElementById('quizProgress').textContent = `第 ${quizIndex+1} / ${quizQueue.length} 题`;
  document.getElementById('quizScore').textContent = `正确 ${quizCorrect} / 已答 ${quizAnswered}`;
  document.getElementById('quizCat').textContent = cat.label + (w.sub? ' · '+w.sub : '');
  document.getElementById('quizZh').textContent = w.zh;
  const input = document.getElementById('quizInput');
  input.value = '';
  input.className = 'quiz-input';
  input.disabled = false;
  input.focus();
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className = 'feedback-line';
  document.getElementById('quizSubmit').textContent = '提交（Enter）';
}

function checkAnswer(){
  if(currentAnswered){ nextQuestion(); return; }
  const w = quizQueue[quizIndex];
  const input = document.getElementById('quizInput');
  const userVal = normalize(input.value);
  const answers = getAnswers(w);
  const isCorrect = answers.includes(userVal) && userVal.length>0;
  currentAnswered = true;
  quizAnswered++;
  const fb = document.getElementById('quizFeedback');
  if(isCorrect){
    quizCorrect++;
    input.className = 'quiz-input correct';
    fb.textContent = '✓ 正确！';
    fb.className = 'feedback-line correct';
  }else{
    quizWrongList.push(w);
    input.className = 'quiz-input wrong';
    fb.textContent = `✗ 正确答案：${w.en}`;
    fb.className = 'feedback-line wrong';
  }
  input.disabled = true;
  document.getElementById('quizScore').textContent = `正确 ${quizCorrect} / 已答 ${quizAnswered}`;
  document.getElementById('quizSubmit').textContent = (quizIndex < quizQueue.length-1) ? '下一题（Enter）' : '查看结果（Enter）';
}

function nextQuestion(){
  if(quizIndex < quizQueue.length-1){
    quizIndex++;
    renderQuizQuestion();
  }else{
    finishQuiz();
  }
}

document.getElementById('quizSubmit').addEventListener('click', checkAnswer);
document.getElementById('quizInput').addEventListener('keydown',(e)=>{
  if(e.key==='Enter') checkAnswer();
});
document.getElementById('quizSpeak').addEventListener('click',()=>{
  speak(quizQueue[quizIndex].en);
});
document.getElementById('endQuiz').addEventListener('click', finishQuiz);

function finishQuiz(){
  showView('dictationSummary');
  const pct = quizAnswered? Math.round(quizCorrect/quizAnswered*100) : 0;
  document.getElementById('sumPct').textContent = pct + '%';
  document.getElementById('sumFrac').textContent = `${quizCorrect} / ${quizAnswered}`;
  const table = document.getElementById('wrongTable');
  if(quizWrongList.length===0){
    table.innerHTML = '<tr><td style="color:var(--ok);">🎉 全部正确，没有需要复习的词！</td></tr>';
    document.getElementById('reviewWrong').style.display='none';
  }else{
    document.getElementById('reviewWrong').style.display='inline-block';
    table.innerHTML = '<tr><th>英文</th><th>中文</th></tr>' +
      quizWrongList.map(w=>`<tr><td class="en">${w.en}</td><td>${w.zh}</td></tr>`).join('');
  }
}

document.getElementById('restartAll').addEventListener('click', ()=>{
  showView('dictationSetup');
  setupDictationCount();
});
document.getElementById('reviewWrong').addEventListener('click', ()=>{
  const wrongOnly = quizWrongList.slice();
  startQuiz(wrongOnly);
});

// ---------------- 视图切换 ----------------
function showView(id){
  ['studyView','dictationSetup','dictationQuiz','dictationSummary'].forEach(v=>{
    document.getElementById(v).style.display = (v===id)?'block':'none';
  });
}

document.getElementById('tabStudy').addEventListener('click', ()=>{
  currentMode='study';
  document.getElementById('tabStudy').classList.add('active');
  document.getElementById('tabDictation').classList.remove('active');
  showView('studyView');
  renderCards();
});
document.getElementById('tabDictation').addEventListener('click', ()=>{
  currentMode='dictation';
  document.getElementById('tabDictation').classList.add('active');
  document.getElementById('tabStudy').classList.remove('active');
  showView('dictationSetup');
  setupDictationCount();
});

function refreshAll(){
  document.getElementById('countBadge').textContent = `已选 ${selectedCats.size} / ${CATS.length} 类，共 ${getFilteredWords().length} 词`;
  if(currentMode==='study') renderCards();
  else setupDictationCount();
}

// 初始化
refreshAll();
showView('studyView');
renderCards();
</script>
